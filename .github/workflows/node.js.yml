name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      message:
        description: 'A custom message'
        required: false
        default: 'Hello from API!'
      spec:
        description: 'Cypress spec file to run (or "all")'
        required: false
        default: 'all'

# 👇 dynamic run title in GitHub Actions UI
run-name: Node.js CI – ${{ github.event.inputs.spec || 'all' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build --if-present

      - name: Run Cypress tests
        run: |
          REPORTER_OPTS="mochaFile=cypress/results/[hash].xml,toConsole=true"
          if [ "${{ github.event.inputs.spec }}" = "all" ]; then
            echo "▶ Running all Cypress tests"
            npx cypress run --reporter mocha-junit-reporter --reporter-options "$REPORTER_OPTS"
          else
            echo "▶ Running Cypress spec: ${{ github.event.inputs.spec }}"
            npx cypress run --spec "${{ github.event.inputs.spec }}" --reporter mocha-junit-reporter --reporter-options "$REPORTER_OPTS"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: cypress/results/*.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Show inputs
        run: |
          echo "Message: ${{ github.event.inputs.message }}"
          echo "Spec: ${{ github.event.inputs.spec }}"
