<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Run CI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>

<body>
  <div class="page">

    <div class="navbar">
      <a class="brand" href="./index.html">🚀 CI Dashboard</a>
      <div class="navbar-controls">
        <nav>
          <a href="./index.html" class="active">Run</a>
          <a href="./reports.html">📊 Reports</a>
        </nav>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </div>

    <div class="page-heading">
      <h1>Run GitHub Workflow</h1>
      <p>Trigger Cypress test runs and watch them complete in real time.</p>
    </div>

    <div class="card">
      <label class="field-label" for="specSearch">Select what to run</label>
      <div class="combobox" id="specCombobox">
        <input
          type="text"
          id="specSearch"
          role="combobox"
          aria-expanded="false"
          aria-controls="specList"
          aria-autocomplete="list"
          autocomplete="off"
          placeholder="Search spec files…"
        />
        <div class="combobox-list" id="specList" role="listbox"></div>
      </div>
      <br /><br />
      <button id="run" class="btn">▶ Run Workflow</button>
    </div>

    <div class="card">
      <div class="split-row">
        <div>
          <h2>Triggered Workflow Status</h2>
          <div id="status-box" class="status-box" aria-live="polite" aria-atomic="true">No workflow triggered yet.</div>
        </div>
        <div class="chart-box">
          <canvas id="statusChart" role="img" aria-label="Pie chart of recent workflow run outcomes">
            Chart showing the proportion of recent workflow runs by outcome.
          </canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Run History</h2>
      <div class="table-wrap">
        <table id="history-table">
          <thead>
            <tr>
              <th>Run ID</th>
              <th>Spec</th>
              <th>Status</th>
              <th>Conclusion</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody>
            <!-- populated by JS; shows skeleton rows until first load completes -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="./app.js"></script>
  <script>
    const SPEC_GROUPS = [
      {
        group: "1-getting-started",
        specs: [
          { value: "cypress/e2e/1-getting-started/todo.cy.js", label: "todo.cy.js" }
        ]
      },
      {
        group: "2-advanced-examples",
        specs: [
          { value: "cypress/e2e/2-advanced-examples/actions.cy.js", label: "actions.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/aliasing.cy.js", label: "aliasing.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/assertions.cy.js", label: "assertions.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/connectors.cy.js", label: "connectors.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/cookies.cy.js", label: "cookies.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/cypress_api.cy.js", label: "cypress_api.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/files.cy.js", label: "files.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/location.cy.js", label: "location.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/misc.cy.js", label: "misc.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/navigation.cy.js", label: "navigation.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/network_requests.cy.js", label: "network_requests.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/querying.cy.js", label: "querying.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/spies_stubs_clocks.cy.js", label: "spies_stubs_clocks.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/storage.cy.js", label: "storage.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/traversal.cy.js", label: "traversal.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/utilities.cy.js", label: "utilities.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/viewport.cy.js", label: "viewport.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/waiting.cy.js", label: "waiting.cy.js" },
          { value: "cypress/e2e/2-advanced-examples/window.cy.js", label: "window.cy.js" }
        ]
      },
      {
        group: "3- tests",
        specs: [
          { value: "cypress/e2e/3- tests/test.cy.js", label: "test.cy.js" }
        ]
      }
    ];
    const ALL_OPTION = { value: "all", label: "✨ Run All Tests" };

    let selectedSpec = ALL_OPTION.value;
    let selectedLabel = ALL_OPTION.label;
    let activeIndex = -1;

    const searchInput = document.getElementById("specSearch");
    const listEl = document.getElementById("specList");

    function flatSpecs() {
      const flat = [{ ...ALL_OPTION, group: null }];
      SPEC_GROUPS.forEach(g => g.specs.forEach(s => flat.push({ ...s, group: g.group })));
      return flat;
    }

    function matchingSpecs(filter) {
      const q = filter.trim().toLowerCase();
      if (!q) return flatSpecs();
      return flatSpecs().filter(s =>
        s.label.toLowerCase().includes(q) ||
        s.value.toLowerCase().includes(q) ||
        (s.group && s.group.toLowerCase().includes(q))
      );
    }

    function renderList(filter) {
      const items = matchingSpecs(filter);
      activeIndex = -1;

      if (!items.length) {
        listEl.innerHTML = `<div class="combobox-empty">No matching spec files</div>`;
        return;
      }

      let html = "";
      let lastGroup;
      items.forEach((item, i) => {
        if (item.group !== lastGroup) {
          html += `<div class="combobox-group-label">${item.group || "Quick actions"}</div>`;
          lastGroup = item.group;
        }
        html += `<div class="combobox-option" data-index="${i}" data-value="${item.value}" role="option">${item.label}</div>`;
      });
      listEl.innerHTML = html;
      listEl._items = items;
    }

    function openList() {
      renderList(searchInput.value === selectedLabel ? "" : searchInput.value);
      listEl.classList.add("open");
      searchInput.setAttribute("aria-expanded", "true");
    }

    function closeList() {
      listEl.classList.remove("open");
      searchInput.setAttribute("aria-expanded", "false");
    }

    function selectItem(item) {
      selectedSpec = item.value;
      selectedLabel = item.label;
      searchInput.value = selectedLabel;
      closeList();
    }

    function highlightActive() {
      listEl.querySelectorAll(".combobox-option").forEach(el => {
        el.classList.toggle("active", Number(el.dataset.index) === activeIndex);
      });
      const activeEl = listEl.querySelector(".combobox-option.active");
      if (activeEl) activeEl.scrollIntoView({ block: "nearest" });
    }

    searchInput.addEventListener("focus", () => {
      searchInput.select();
      openList();
    });

    searchInput.addEventListener("input", () => openList());

    searchInput.addEventListener("blur", () => {
      setTimeout(() => {
        closeList();
        searchInput.value = selectedLabel;
      }, 150);
    });

    searchInput.addEventListener("keydown", (e) => {
      const items = listEl._items || [];
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (!listEl.classList.contains("open")) return openList();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        highlightActive();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        highlightActive();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (activeIndex >= 0 && items[activeIndex]) selectItem(items[activeIndex]);
      } else if (e.key === "Escape") {
        closeList();
        searchInput.value = selectedLabel;
      }
    });

    listEl.addEventListener("mousedown", (e) => {
      const opt = e.target.closest(".combobox-option");
      if (!opt) return;
      e.preventDefault();
      const items = listEl._items || [];
      const item = items[Number(opt.dataset.index)];
      if (item) selectItem(item);
    });

    searchInput.value = selectedLabel;

    let currentRunId = null;
    let lastKnownRunId = null;
    let chartInstance = null;
    let statusFrozen = false;
    let historyLoaded = false;

    async function captureLastRunId() {
      try {
        const r = await fetch("https://pages-test-sooty.vercel.app/api/history");
        const data = await r.json();
        if (r.ok && data.runs.length > 0) {
          lastKnownRunId = data.runs[0].id;
        }
      } catch (err) {
        console.error("Could not capture last run ID:", err.message);
      }
    }

    async function dispatch() {
      await captureLastRunId();
      statusFrozen = false;

      const runButton = document.getElementById("run");

      runButton.disabled = true;
      runButton.innerHTML = `<span class="spinner"></span> Running...`;

      const body = {
        spec: selectedSpec,
        message: selectedSpec === "all"
          ? "Triggered full test suite"
          : `Triggered ${selectedSpec}`
      };

      try {
        const r = await fetch("https://pages-test-sooty.vercel.app/api/trigger", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        if (r.ok) {
          const label = selectedSpec === "all" ? "✨ All Tests" : selectedSpec.split("/").pop();
          document.getElementById("status-box").innerHTML =
            `<p><span class="spinner"></span> Waiting for new run (<b>${label}</b>)...</p>`;
          waitForNextRun();
        } else {
          const data = await r.json();
          document.getElementById("status-box").innerHTML =
            `<p style="color:var(--failure);">❌ ${r.status}: ${data.error || "Unknown error"}</p>`;
        }
      } catch (err) {
        document.getElementById("status-box").innerHTML =
          `<p style="color:var(--failure);">⚠️ ${err.message}</p>`;
      } finally {
        runButton.disabled = false;
        runButton.innerHTML = "▶ Run Workflow";
      }
    }

    async function waitForNextRun() {
      if (statusFrozen) return;

      try {
        const r = await fetch("https://pages-test-sooty.vercel.app/api/history");
        const data = await r.json();
        const runs = data.runs || [];
        const newRun = runs.find(run => !lastKnownRunId || run.id > lastKnownRunId);

        if (newRun) {
          currentRunId = newRun.id;
          trackTriggeredRun(newRun);
        } else {
          setTimeout(waitForNextRun, 3000);
        }
      } catch (err) {
        console.error("Error waiting for next run:", err.message);
        setTimeout(waitForNextRun, 3000);
      }
    }

    async function trackTriggeredRun(run) {
      if (statusFrozen) return;
      const box = document.getElementById("status-box");

      const specLabel = run.name?.includes("–")
        ? (() => {
            const rawSpec = run.name.split("–").pop().trim();
            return rawSpec === "all" ? "✨ All Tests" : rawSpec.split("/").pop();
          })()
        : "✨ All Tests";

      if (run.status === "queued" || run.status === "in_progress") {
        box.innerHTML = `
          <p><span class="spinner"></span><b>${run.name || "GitHub Workflow"} – ${specLabel}</b></p>
          <p>Run ID: ${run.id}</p>
          <p>Status: ${run.status}</p>
          <p>Conclusion: pending</p>
          <p><a href="${run.url}" target="_blank">🔗 View on GitHub</a></p>
        `;
        setTimeout(() => refreshRun(run.id), 5000);
      } else {
        const icon = run.conclusion === "success" ? "✅" : "❌";
        box.innerHTML = `
          <p>${icon} <b>${run.name || "GitHub Workflow"} – ${specLabel}</b></p>
          <p>Run ID: ${run.id}</p>
          <p>Status: ${run.status}</p>
          <p>Conclusion: ${run.conclusion}</p>
          <p><a href="${run.url}" target="_blank">🔗 View on GitHub</a></p>
        `;
        currentRunId = null;
        statusFrozen = true;
      }
    }

    async function refreshRun(runId) {
      if (statusFrozen) return;
      try {
        const r = await fetch("https://pages-test-sooty.vercel.app/api/history");
        const data = await r.json();
        const run = (data.runs || []).find(r => String(r.id) === String(runId));
        if (run) trackTriggeredRun(run);
      } catch (err) {
        console.error("Error refreshing run:", err.message);
      }
    }

    async function updateHistoryFromServer() {
      if (!historyLoaded) {
        document.querySelector("#history-table tbody").innerHTML = skeletonRows(4, 5);
      }
      try {
        const r = await fetch("https://pages-test-sooty.vercel.app/api/history");
        const data = await r.json();
        if (r.ok) {
          historyLoaded = true;
          renderHistory(data.runs);
          updateChart(data.runs);
        }
      } catch (err) {
        console.error("History update failed:", err.message);
        if (!historyLoaded) {
          document.querySelector("#history-table tbody").innerHTML =
            `<tr><td colspan="5"><div class="empty">Couldn't load run history.</div></td></tr>`;
        }
      }
    }

    function renderHistory(runs) {
      const tbody = document.querySelector("#history-table tbody");

      if (!runs.length) {
        tbody.innerHTML = `<tr><td colspan="5"><div class="empty">No runs yet.</div></td></tr>`;
        return;
      }

      tbody.innerHTML = runs.map(run => {
        const cls = String(run.id) === String(currentRunId) ? "highlight" : "";

        let specLabel = "✨ All Tests";
        if (run.name?.includes("–")) {
          const rawSpec = run.name.split("–").pop().trim();
          specLabel = rawSpec === "all" ? "✨ All Tests" : rawSpec.split("/").pop();
        }

        return `
          <tr class="${cls}" data-id="${run.id}">
            <td data-label="Run ID">${run.id}</td>
            <td data-label="Spec">${specLabel}</td>
            <td data-label="Status">${statusBadge(run.status, null)}</td>
            <td data-label="Conclusion">${run.conclusion ? statusBadge(null, run.conclusion) : "pending"}</td>
            <td data-label="Link"><a href="${run.url}" target="_blank">🔗 View</a></td>
          </tr>
        `;
      }).join("");
    }

    function updateChart(runs) {
      const counts = { success: 0, failure: 0, running: 0, other: 0 };
      runs.forEach(run => {
        if (run.conclusion === "success") counts.success++;
        else if (run.conclusion === "failure") counts.failure++;
        else if (run.status === "in_progress" || run.status === "queued") counts.running++;
        else counts.other++;
      });

      const total = counts.success + counts.failure + counts.running + counts.other;
      const ctx = document.getElementById("statusChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: "pie",
        data: {
          labels: ["Success", "Failure", "Running", "Other"],
          datasets: [{
            data: [counts.success, counts.failure, counts.running, counts.other],
            backgroundColor: ["#22c55e", "#ef4444", "#f59e0b", "#6b7280"]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const value = context.raw;
                  const percent = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                  return `${context.label}: ${value} (${percent}%)`;
                }
              }
            },
            datalabels: {
              color: "#fff",
              formatter: (value) => {
                const percent = total > 0 ? ((value / total) * 100).toFixed(0) : 0;
                return value > 0 ? `${percent}%` : "";
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    document.getElementById("run").addEventListener("click", dispatch);

    setInterval(updateHistoryFromServer, 15000);
    updateHistoryFromServer();
  </script>
</body>
</html>
