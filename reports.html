<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>CI Reports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f9fafb;
      --card-bg: #fff;
      --text: #111827;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #22c55e;
      --failure: #ef4444;
      --warning: #f59e0b;
      --muted: #6b7280;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 32px;
      color: var(--text);
    }
    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); }
    .back-link { display: block; text-align: center; margin-bottom: 24px; }
    .back-link a { color: var(--primary); text-decoration: none; font-size: 0.9rem; }
    .container { max-width: 1100px; margin: auto; display: grid; gap: 24px; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }
    .stat-card {
      background: var(--card-bg); border-radius: var(--radius); padding: 18px;
      box-shadow: var(--shadow); text-align: center;
    }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .charts-row { display: flex; gap: 20px; flex-wrap: wrap; }
    .chart-card { flex: 1; min-width: 320px; }
    .chart-card canvas { max-height: 280px; }
    table {
      width: 100%; border-collapse: collapse; margin-top: 14px;
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--card-bg);
    }
    th, td { padding: 10px 12px; text-align: left; font-size: 0.9rem; }
    th { background: #f3f4f6; font-weight: 600; color: #374151; }
    tr.failure { background-color: #fef2f2; }
    tr:hover { background-color: #dbeafe; }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 12px 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>

<body>
  <h1>📊 CI Reports</h1>
  <div class="back-link"><a href="./index.html">⬅ Back to Dashboard</a></div>

  <div class="container">

    <div class="stats-grid">
      <div class="stat-card">
        <div class="value" id="stat-total">–</div>
        <div class="label">Total Runs</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-success-rate">–</div>
        <div class="label">Success Rate</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-avg-duration">–</div>
        <div class="label">Avg Duration</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-failures">–</div>
        <div class="label">Failures</div>
      </div>
    </div>

    <div class="card charts-row">
      <div class="chart-card">
        <h2>Runs by Spec</h2>
        <canvas id="specChart"></canvas>
      </div>
      <div class="chart-card">
        <h2>Overall Outcome</h2>
        <canvas id="outcomeChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>Recent Failures</h2>
      <table id="failures-table">
        <thead>
          <tr>
            <th>Run ID</th>
            <th>Spec</th>
            <th>Date</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="no-failures" style="display:none;">No failures in recent history 🎉</div>
    </div>

  </div>

  <script>
    const API_BASE = "https://pages-test-sooty.vercel.app";
    let specChartInstance = null;
    let outcomeChartInstance = null;

    function formatDuration(seconds) {
      if (seconds === null || seconds === undefined) return "–";
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    function renderStats(report) {
      document.getElementById("stat-total").textContent = report.totalRuns;
      document.getElementById("stat-success-rate").textContent = `${report.successRate}%`;
      document.getElementById("stat-avg-duration").textContent = formatDuration(report.avgDurationSeconds);
      document.getElementById("stat-failures").textContent = report.failureCount;
    }

    function renderSpecChart(bySpec) {
      const ctx = document.getElementById("specChart").getContext("2d");
      if (specChartInstance) specChartInstance.destroy();
      specChartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels: bySpec.map(s => s.spec),
          datasets: [
            { label: "Success", data: bySpec.map(s => s.success), backgroundColor: "#22c55e" },
            { label: "Failure", data: bySpec.map(s => s.failure), backgroundColor: "#ef4444" }
          ]
        },
        options: {
          responsive: true,
          scales: {
            x: { stacked: true },
            y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } }
          },
          plugins: { legend: { position: "bottom" }, datalabels: { display: false } }
        }
      });
    }

    function renderOutcomeChart(report) {
      const ctx = document.getElementById("outcomeChart").getContext("2d");
      const counts = [report.successCount, report.failureCount, report.cancelledCount, report.otherCount];
      const total = counts.reduce((a, b) => a + b, 0);
      if (outcomeChartInstance) outcomeChartInstance.destroy();
      outcomeChartInstance = new Chart(ctx, {
        type: "pie",
        data: {
          labels: ["Success", "Failure", "Cancelled", "Other"],
          datasets: [{ data: counts, backgroundColor: ["#22c55e", "#ef4444", "#f59e0b", "#6b7280"] }]
        },
        options: {
          plugins: {
            legend: { position: "bottom" },
            datalabels: {
              color: "#fff",
              formatter: (value) => {
                const percent = total > 0 ? ((value / total) * 100).toFixed(0) : 0;
                return value > 0 ? `${percent}%` : "";
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });
    }

    function renderFailures(recentFailures) {
      const tbody = document.querySelector("#failures-table tbody");
      const emptyEl = document.getElementById("no-failures");

      if (!recentFailures.length) {
        tbody.innerHTML = "";
        emptyEl.style.display = "block";
        return;
      }

      emptyEl.style.display = "none";
      tbody.innerHTML = recentFailures.map(f => {
        const specLabel = f.spec === "all" ? "✨ All Tests" : f.spec.split("/").pop();
        const date = f.created_at ? new Date(f.created_at).toLocaleString() : "–";
        return `
          <tr class="failure">
            <td>${f.id}</td>
            <td>${specLabel}</td>
            <td>${date}</td>
            <td><a href="${f.url}" target="_blank">🔗 View</a></td>
          </tr>
        `;
      }).join("");
    }

    async function loadReport() {
      try {
        const r = await fetch(`${API_BASE}/api/reports`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || "Failed to load report");

        renderStats(data);
        renderSpecChart(data.bySpec);
        renderOutcomeChart(data);
        renderFailures(data.recentFailures);
      } catch (err) {
        console.error("Error loading report:", err.message);
      }
    }

    loadReport();
  </script>
</body>
</html>
